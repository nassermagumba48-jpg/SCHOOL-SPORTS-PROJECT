{% extends "./base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-4">

    <h2 class="mb-3">Sports</h2>


    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#sportModal" onclick="openAddSport()">
        Add Sport
    </button>


    <div class="modal fade" id="sportModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitleSport">Add Sport</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form id="sportForm" method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <input type="hidden" name="sport_id" id="sport_id">
                    </form>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="sportForm" class="btn btn-success">Save</button>
                </div>

            </div>
        </div>
    </div>




    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>No.</th>
                <th>Sport Name</th>
                <th>Tournament</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            {% for s in sport %}
                <tr>
                    <td>{{ s.id }}</td>
                    <td>{{ s.sport_name }}</td>
                    <td>{{ s.tournament }}</td>
                    <td>
                        <a href="{% url 'edit_sport_page' s.id %}" 
                           onclick="openEditSport('{{ s.id }}', '{{ s.sport_name }}', '{{ s.tournament.id }}')" >
                           <i class="bi bi-pencil-square"></i>

                           Edit
                        </a>
                        |
                        <a href="{% url 'delete_sport_page' s.id %}"
                           onclick="return confirm('Are you sure you want to delete this sport?')">
                           <i class="bi bi-trash-fill"></i>

                           Delete
                        </a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
    function openAddSport() {
        document.getElementById("modalTitleSport").innerText = "Add Sport";
        document.getElementById("sportForm").reset();
        document.getElementById("sport_id").value = "";
    }

    function openEditSport(id, sport_name, tournament) {
        document.getElementById("modalTitleSport").innerText = "Edit Sport";

        document.getElementById("sport_id").value = id;
        document.getElementsByName("sport_name")[0].value = sport_name;
        document.getElementsByName("tournament")[0].value = tournament;

        let modal = new bootstrap.Modal(document.getElementById("sportModal"));
        modal.show();
    }
</script>

{% endblock content %}
